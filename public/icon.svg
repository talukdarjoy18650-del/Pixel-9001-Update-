<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Sky backdrop -->
  <rect width="64" height="64" rx="12" fill="#bfe6ff" />
  <rect y="36" width="64" height="28" rx="0" fill="#e8f6ff" />
  <!-- Pixel clouds -->
  <rect x="8" y="10" width="12" height="4" fill="#ffffff" />
  <rect x="10" y="8" width="6" height="2" fill="#ffffff" />
  <rect x="42" y="14" width="14" height="4" fill="#ffffff" />
  <rect x="46" y="12" width="6" height="2" fill="#ffffff" />
  <!-- Outer block outline -->
  <rect x="12" y="18" width="40" height="36" fill="#24331d" />
  <!-- Dirt base -->
  <rect x="15" y="29" width="34" height="22" fill="#8a5a33" />
  <!-- Dirt speckles -->
  <rect x="18" y="34" width="4" height="4" fill="#5e3b1f" />
  <rect x="28" y="42" width="4" height="4" fill="#5e3b1f" />
  <rect x="40" y="36" width="4" height="4" fill="#5e3b1f" />
  <rect x="22" y="45" width="3" height="3" fill="#a87043" />
  <rect x="35" y="33" width="3" height="3" fill="#a87043" />
  <!-- Grass top -->
  <rect x="15" y="21" width="34" height="8" fill="#5fb336" />
  <rect x="15" y="29" width="5" height="3" fill="#5fb336" />
  <rect x="25" y="29" width="6" height="4" fill="#3e8a22" />
  <rect x="36" y="29" width="5" height="3" fill="#5fb336" />
  <rect x="44" y="29" width="5" height="2" fill="#3e8a22" />
  <rect x="19" y="21" width="6" height="4" fill="#3e8a22" />
  <rect x="32" y="21" width="8" height="3" fill="#7ad14b" />
  <!-- Diamond pixel gem inlay -->
  <rect x="27" y="34" width="10" height="10" fill="#24331d" />
  <rect x="29" y="36" width="6" height="6" fill="#2fd3c8" />
  <rect x="29" y="36" width="2" height="2" fill="#b7fff9" />
  <rect x="33" y="40" width="2" height="2" fill="#1fa198" />
